<section id="semaforo" class="frame">
    <div class="row g-4">
        
        <section id="section-buttons-semaforo" class="col-12 col-md-4 col-lg-4">
            <div class="card h-100">
                <div class="card-body">
                    <h1 class="text-center fw-bold">Cores</h1>
                    <p class="small text-muted text-center">
                        🔴 Não pode • 🟡 Atenção • 🟢 Pode
                    </p>

                    <hr>

                    <div id="btn-pallete" class="traffic-light d-flex flex-row flex-md-column flex-wrap
                    gap-3 justify-content-center align-items-center">
                        <button class="token vermelho" type="button" data-color="vermelho"></button>
                        <button class="token amarelo" type="button" data-color="amarelo"></button>
                        <button class="token verde" type="button" data-color="verde"></button>
                    </div>

                    <hr>

                    <p class="mb-1 small text-center">
                        Acertos: <strong id="sf-hits">0</strong> •
                        Erros: <strong id="sf-misses">0</strong>
                    </p>

                    <h5 class="mb-2 text-center" id="sf-feedback" aria-live="polite"></h5>

                    <button class="btn btn-primary btn-sm d-flex align-items-center" type="button" id="btn-reset">
                        Reiniciar
                    </button>

                </div>
            </div>
        </section>

        <section id="section-body" class="col-12 col-md-8 col-lg-8">
            <div class="card h-100">
                <div class="card-body d-flex justify-content-center">

                    <!-- CORPO MENINO -->
                    <div class="body-stage">
                        <img class="body-img" src="assets/img/garoto-semaforo.png" alt="body-boy" draggable="false">

                        <div id="head" class="drop-zone" style="top: 11%; left: 50%;" data-correct="verde"></div>
                        <div id="chest" class="drop-zone" style="top: 41%; left: 50%;" data-correct="amarelo"></div>
                        <div id="belly" class="drop-zone" style="top: 54%; left: 50%;" data-correct="amarelo"></div>
                        
                        <div id="left-hand" class="drop-zone" style="top: 51%; left: 18%;" data-correct="verde"></div>
                        <div id="right-hand" class="drop-zone" style="top: 51%; left: 81%;" data-correct="verde"></div>
                        
                        <div id="bottom" class="drop-zone" style="top: 65%; left: 50%;" data-correct="vermelho"></div>
                        
                        <div id="left-feet" class="drop-zone" style="top: 82%; left: 36%;" data-correct="verde"></div>
                        <div id="right-feet" class="drop-zone" style="top: 82%; left: 64%;" data-correct="verde"></div>
                    </div>
                </div>
            </div>
        </section>

    </div>
</section>

<link rel="stylesheet" href="/assets/css/semaforo_style.css">
