<section id="jogo" class="frame" aria-labelledby="titulo-jogo">
    <h2 class="d-flex justify-content-center" id="titulo-jogo">Jogo</h2>

    <div class="game-grid">
        <aside class="panel scoreboard" aria-label="Placar">
            <div class="mini-light" id="mini-light" data-lit="none" aria-hidden="true">
                <span class="lamp red"></span>
                <span class="lamp yellow"></span>
                <span class="lamp green"></span>
            </div>

            <dl class="stats">
                <div>
                    <dt>Pontos</dt>
                    <dd id="stat-score">0</dd>
                </div>

                <div>
                    <dt>Pergunta</dt>
                    <dd id="stat-question">0/10</dd>
                </div>

                <div>
                    <dt>Acertos</dt>
                    <dd id="stat-hits">0</dd>
                </div>

                <div>
                    <dt>Erros</dt>
                    <dd id="stat-misses">0</dd>
                </div>
            </dl>
        </aside>

        <div class="panel stage">
            <div id="screen-start" class="screen">
                <h3>Pronto para jogar?</h3>
                <p>São 10 situações. Escolha a cor do semáforo para cada uma.</p>
                <button class="btn btn-primary" id="btn-start" type="button">Iniciar</button>
            </div>

            <div id="screen-play" class="screen" hidden>
                <p id="progress-label">Pergunta 1 de 10</p>

                <div class="progress" id="progress" role="progressbar" aria-labelledby="progress-label" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0">
                    <div id="progress-fill"></div>
                </div>

                <h3 id="question-text" tabindex="-1"></h3>

                <div class="choices" role="group" aria-label="Escolha uma cor">
                    <button class="choice red" type="button" data-color="vermelho">
                        🔴 Vermelho <span class="tag"></span>
                    </button>

                    <button class="choice yellow" type="button" data-color="amarelo">
                        🟡 Amarelo <span class="tag"></span>
                    </button>

                    <button class="choice green" type="button" data-color="verde">
                        🟢 Verde <span class="tag"></span>
                    </button>
                </div>

                <div id="feedback" class="feedback" role="status" aria-live="polite"></div>
                
                <button class="btn btn-primary" id="btn-next" type="button" hidden>Próxima pergunta</button>
            </div>

            <div id="screen-result" class="screen" hidden>
                <h3 id="result-title" tabindex="-1">Fim de jogo!</h3>

                <p class="big-score">
                    <span id="result-score">0</span> pontos
                </p>

                <ul class="result-list">
                    <li>Acertos: 
                        <strong id="result-hits">0</strong>
                    </li>

                    <li>Erros: 
                        <strong id="result-misses">0</strong>
                    </li>

                    <li>Aproveitamento: 
                        <strong id="result-percent">0%</strong>
                    </li>
                </ul>

                <p id="result-message"></p>

                <button class="btn btn-primary" id="btn-restart" type="button">Jogar novamente</button>
            </div>

        </div>
    </div>
</section>
